<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endourology Pearls Portal — Interactive Library</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased h-screen flex flex-col overflow-hidden">
  <!-- Top Bar -->
  <header class="bg-slate-900 text-white px-4 py-2.5 flex items-center justify-between gap-3 shrink-0 border-b border-slate-800">
    <div class="flex items-center gap-2.5 min-w-0">
      <button type="button" id="sidebar-toggle" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold shrink-0" aria-label="Toggle library sidebar">
        ☰ Library
      </button>
      <div class="min-w-0">
        <div class="text-sm sm:text-base font-bold tracking-tight truncate">Endourology Pearls Portal</div>
        <div id="active-subtitle" class="text-[11px] text-slate-400 truncate">Campbell-Walsh-Wein Urology Interactive Library</div>
      </div>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <span id="progress-pill" class="hidden md:inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-semibold bg-slate-800 text-emerald-300 border border-slate-700">
        0 / 35 Read
      </span>
      <button type="button" id="share-btn" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
        Share Link
      </button>
      <button type="button" id="mark-read-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white transition">
        Mark as Read
      </button>
    </div>
  </header>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 hidden bg-slate-900 text-white text-xs font-semibold px-3.5 py-2.5 rounded-xl shadow-lg border border-slate-700"></div>

  <!-- Main Workspace -->
  <div class="flex-1 flex min-h-0 relative">
    <!-- Sidebar Index -->
    <aside id="sidebar" class="w-80 max-w-[85vw] bg-white border-r border-slate-200 flex flex-col shrink-0 z-20 absolute inset-y-0 left-0 lg:static shadow-xl lg:shadow-none transition-transform duration-200">
      <div class="p-3 border-b border-slate-100 space-y-2">
        <input id="search-input" type="search" placeholder="Filter pearls by topic or keyword..." class="w-full rounded-lg border border-slate-300 px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <div class="flex items-center justify-between text-[11px] text-slate-500 px-0.5">
          <span id="count-label">35 pearls (Days 1–34)</span>
          <span>Fast-loading portal</span>
        </div>
      </div>
      <div id="pearl-list" class="flex-1 overflow-y-auto p-2.5 space-y-2"></div>
      <div class="p-3 border-t border-slate-100 bg-slate-50 text-[11px] text-slate-500 leading-relaxed">
        Shareable via direct URL parameter (e.g., <code>?p=day34</code>) when hosted on GitHub Pages.
      </div>
    </aside>

    <!-- Interactive Pearl Viewer -->
    <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
      <iframe id="pearl-viewer" title="Interactive Endourology Pearl" class="w-full flex-1 border-0 bg-slate-50"></iframe>
    </main>
  </div>

  <script>
    (function () {
      const PEARLS = [{"id": "day34", "badge": "Day 34", "date": "2026-11-27", "category": "Energy & Laser Biophysics", "readTime": "10\u201315 min", "figures": 5, "url": "day34.html", "title": "Energy Modalities in Endourology: Lasers, Thermal Kinetics, Electrosurgery & BWL", "summary": "Photomechanical vs. photothermal laser physics, TFL vs. Ho:YAG, thermal safety calculator, monopolar/bipolar circuits, and BWL."}, {"id": "day33", "badge": "Day 33", "date": "2026-11-25", "category": "Endoscopy & Instrumentation", "readTime": "10\u201315 min", "figures": 5, "url": "day33.html", "title": "Principles of Urologic Endoscopy: Optics, Guidewires & Scope Preservation", "summary": "Hopkins rod-lens vs. digital CMOS optics, single-use vs. reusable fURS cost calculator, guidewire buckling forces, and 'riding the rails' access."}, {"id": "day32", "badge": "Day 32", "date": "2026-11-23", "category": "Lower Urinary Tract Calculi", "readTime": "10\u201315 min", "figures": 4, "url": "day32.html", "title": "Lower Urinary Tract Calculi: Bladder, Urethral, Prostatic & SV Stones", "summary": "BOO & simultaneous TURP evidence, TUCL vs. PCCL vs. open cystolithotomy, SCI/transplant/diversion bladders, urethral & TRU-SVS stones."}, {"id": "day31", "badge": "Day 31", "date": "2026-11-21", "category": "Renal Anatomy & RIRS/PCNL", "readTime": "10\u201315 min", "figures": 5, "url": "day31.html", "title": "Pelvicalyceal Architecture, Br\u00f6del vs. Hodson & Lower Pole Morphometry", "summary": "30\u00b0 renal rotation, Br\u00f6del vs. Hodson calyceal angles, Sampaio A1\u2013B2 & Modified Takazawa 3D subtypes, lower-pole calculator, and antegrade rescue."}, {"id": "hyperparathyroidism", "badge": "Metabolic Brief", "date": "2026-11-16", "category": "Metabolic Stone Disease", "readTime": "8\u201310 min", "figures": 0, "url": "hyperparathyroidism.html", "title": "Hyperparathyroidism (Primary, Secondary & Tertiary) & The Calcium Axis", "summary": "Interactive PTH\u2013Calcitriol\u2013FGF23 axis across Primary, Secondary, and Tertiary HPT, biochemical pattern classifier, CCCR calculator, and surgical criteria."}, {"id": "day30", "badge": "Day 30", "date": "2026-10-06", "category": "Metabolic Stone Disease", "readTime": "5 min", "figures": 0, "url": "day30.html", "title": "Primary Hyperparathyroidism & Distal RTA: Calcium Homeostasis, Randall's Plaques & Algorithms", "summary": "PHPT dual calcium axis & CCCR vs. FHH, Type 1 dRTA \u03b1-intercalated cell defect & nephrocalcinosis, Randall's plaque loop-of-Henle biomineralization, and potassium citrate vs. sodium bicarbonate."}, {"id": "day29", "badge": "Day 29", "date": "2026-10-05", "category": "Strictures & UPJO", "readTime": "5 min", "figures": 0, "url": "day29.html", "title": "Upper Tract Urodynamics & The Whitaker Test: Pressure-Flow Physics & Equivocal UPJO", "summary": "Flaccid reservoir vs. true obstruction, MAG3 pitfalls in poor function (<20%), 10 mL/min antegrade perfusion setup, \u0394P cutoffs (<15 / 15\u201322 / >22 cm H\u2082O), and artifact prevention."}, {"id": "day28", "badge": "Day 28", "date": "2026-10-04", "category": "Metabolic Stone Disease", "readTime": "5 min", "figures": 0, "url": "day28.html", "title": "Enteric Hyperoxaluria & Malabsorptive Nephrolithiasis: Saponification & Targeted Binders", "summary": "Fatty acid saponification, bile-salt colonic permeability, the intact-colon requirement, triple lithogenic defect, oxalate nephropathy ESRD risk, and mealtime calcium citrate + cholestyramine."}, {"id": "day27", "badge": "Day 27", "date": "2026-10-03", "category": "Metabolic Stone Disease", "readTime": "5 min", "figures": 0, "url": "day27.html", "title": "Uric Acid Nephrolithiasis: The 'Acid Trap', Dual-Energy CT & Chemolysis Protocols", "summary": "Renal insulin resistance & defective ammoniagenesis, radiolucent KUB vs. DECT (>95%\u201398% specificity), oral potassium citrate chemolysis (pH 6.2\u20136.8), role of allopurinol, and THAM/bicarb irrigation."}, {"id": "day26", "badge": "Day 26", "date": "2026-10-02", "category": "PCNL Access & Dilation", "readTime": "5 min", "figures": 0, "url": "day26.html", "title": "Prone vs. Supine PCNL: Anatomic Shifts, Cardiorespiratory Dynamics & ECIRS Ergonomics", "summary": "GMSV & Barts positioning, anterior colon fall-away vs. hypermobile kidney tenting, cardiorespiratory benefits in obesity/COPD, downhill sheath drainage, and when prone remains preferred."}, {"id": "day25", "badge": "Day 25", "date": "2026-10-01", "category": "Metabolic Stone Disease", "readTime": "5 min", "figures": 0, "url": "day25.html", "title": "Cystinuria & Brushite Calculi: Lithotripsy Resistance, Alkalinization & Thiol Chelation", "summary": "SLC3A1/SLC7A9 COLA defect, hexagonal crystals & nitroprusside test, SWL failure, high-energy Ho:YAG/TFL settings, 4-L hydration + pH 7.0\u20137.5 alkalinization, tiopronin proteinuria monitoring, and brushite."}, {"id": "day24", "badge": "Day 24", "date": "2026-09-30", "category": "Special Populations", "readTime": "5 min", "figures": 0, "url": "day24.html", "title": "Pediatric Endourology & Stone Disease: Miniaturized Tools, Access Nuances & Metabolic Mandates", "summary": "Mandatory metabolic workup on stone #1, 4.5\u20136.5 Fr semirigid & 7.5 Fr flexible scopes, pediatric SWL pulmonary shielding, warmed saline hypothermia prevention, and Image Gently grid removal."}, {"id": "day23", "badge": "Day 23", "date": "2026-09-29", "category": "Complications & Safety", "readTime": "5 min", "figures": 0, "url": "day23.html", "title": "Ureteral Injury & Avulsion in URS: Crisis Recognition & Reconstructive Algorithms", "summary": "Trapped-basket escape protocol (disassemble + laser through mesh), minor vs. major perforation management, Al-Awadi avulsion grading, and psoas hitch / Boari / ileal ureter / autotransplant hierarchy."}, {"id": "day22", "badge": "Day 22", "date": "2026-09-28", "category": "Complications & Safety", "readTime": "5 min", "figures": 0, "url": "day22.html", "title": "Renal Vascular Complications in PCNL: Pseudoaneurysm, AV Fistula & Angioembolization", "summary": "Interlobar arterial vulnerability & torque shearing, immediate vs. 7\u201314 day delayed hemorrhage, PSA ('yin-yang' sign) vs. AVF (machinery bruit), and superselective microcoil embolization."}, {"id": "day21", "badge": "Day 21", "date": "2026-09-27", "category": "RIRS & Ureteroscopy", "readTime": "5 min", "figures": 0, "url": "day21.html", "title": "Medical Expulsive Therapy (MET) & Ureteral Physiology: Pharmacology, Trials & Safety Limits", "summary": "Proximal calyceal pacemaker & luminal coaptation, \u03b1\u2081D/\u03b1\u2081A receptor density gradient, reconciling the SUSPEND trial with AUA/EAU guidelines, and the 4\u20136 week nephron-loss limit."}, {"id": "day20", "badge": "Day 20", "date": "2026-09-26", "category": "PCNL Access & Dilation", "readTime": "5 min", "figures": 0, "url": "day20.html", "title": "Intracorporeal PCNL Lithotripters: Ballistic, Ultrasonic & Dual-Probe Combined Systems", "summary": "Ballistic tensile spallation, piezoelectric ultrasonic cavitation & dry-running burns, single-probe dual-action Trilogy/ShockPulse clearance speeds, and vacuum collapse avoidance."}, {"id": "day19", "badge": "Day 19", "date": "2026-09-25", "category": "Special Populations", "readTime": "5 min", "figures": 0, "url": "day19.html", "title": "Nephrolithiasis in Pregnancy: Gestational Physiology, Doppler Imaging & URS Protocols", "summary": "Gestational hyperfiltration & physiologic hydronephrosis, Doppler RI & transvaginal US, MRI HASTE vs. ultra-low-dose CT (<5 mGy), NSAID contraindications, and fluoroless URS protocols."}, {"id": "day18", "badge": "Day 18", "date": "2026-09-24", "category": "Stents & Drainage", "readTime": "5 min", "figures": 0, "url": "day18.html", "title": "Ureteral Stents: Biomaterial Physics, Flow Dynamics & Morbidity Mitigation", "summary": "Polyurethane vs. silicone vs. metallic coils, extraluminal vs. intraluminal flow, height-based length sizing, midline coil crossing, and \u03b1\u2081-blocker + \u03b2\u2083-agonist/NSAID symptom control."}, {"id": "day17", "badge": "Day 17", "date": "2026-09-23", "category": "Complex & Diversion Stones", "readTime": "5 min", "figures": 0, "url": "day17.html", "title": "Endourology in Anomalous Kidneys: Horseshoe, Pelvic Ectopic & Malrotated Systems", "summary": "Horseshoe fusion/malrotation & retrorenal colon hazard, upper-pole PCNL trajectory, RIRS over the isthmus, laparoscopic-assisted PCNL for pelvic kidneys, and crossed-fused ectopia."}, {"id": "day16", "badge": "Day 16", "date": "2026-09-22", "category": "UTUC & Oncology", "readTime": "5 min", "figures": 0, "url": "day16.html", "title": "Upper Tract Urothelial Carcinoma (UTUC): Endoscopic Staging, Laser Ablation & Chemoablation", "summary": "Low- vs. high-risk stratification, barbotage before contrast, flat-wire basket/BIGopsy architecture, Ho:YAG vs. Tm:YAG base clearance, Jelmyto reverse-thermal hydrogel, and surveillance."}, {"id": "day15", "badge": "Day 15", "date": "2026-09-21", "category": "Complications & Safety", "readTime": "5 min", "figures": 0, "url": "day15.html", "title": "Intraoperative Radiation Safety: C-Arm Physics, ALARA & Low-Dose Protocols", "summary": "Stochastic vs. deterministic biology, tube-below/detector-above scatter geometry, inverse square law, lead eyewear/thyroid collars, pulsed fluoro, and fluoroless URS protocols."}, {"id": "day14", "badge": "Day 14", "date": "2026-09-20", "category": "Complications & Safety", "readTime": "5 min", "figures": 0, "url": "day14.html", "title": "Post-Endourology Urosepsis: IRP Dynamics, Culture Discrepancies & Resuscitation", "summary": "Pyelovenous backflow pressure ceiling, bladder vs. pelvic/stone culture discordance, 60/90-minute operative time rules, SIRS vs. qSOFA/PCT, and Hour-1 resuscitation + source control."}, {"id": "day13", "badge": "Day 13", "date": "2026-09-19", "category": "Complex & Diversion Stones", "readTime": "5 min", "figures": 0, "url": "day13.html", "title": "Calyceal Diverticular Calculi: Anatomy, Modality Selection & Cavity Obliteration", "summary": "Non-secretory urothelial cavity & milk of calcium, PCNL vs. RIRS selection (posterior vs. anterior upper pole), blue-dye ostium hunting, superior/inferior infundibulotomy, and cavity fulguration."}, {"id": "day12", "badge": "Day 12", "date": "2026-09-18", "category": "Stents & Drainage", "readTime": "5 min", "figures": 0, "url": "day12.html", "title": "The 'Forgotten' Encrusted Stent: KSA Scoring, Multimodal Clearance & Avulsion Avoidance", "summary": "Exponential encrustation curve, zero-traction rule, KSA scoring, bottom-up multimodal extraction (cystolithotripsy \u2192 URS \u2192 PCNL), fractured stent balloon rescue, and registries."}, {"id": "day11", "badge": "Day 11", "date": "2026-09-17", "category": "SWL & Acoustic Physics", "readTime": "5 min", "figures": 0, "url": "day11.html", "title": "Shock Wave Lithotripsy (SWL): Acoustic Physics, Coupling Dynamics & Renal Protection", "summary": "Triple-D score nomogram, cavitation shielding paradox at 120 shocks/min, the 2% air-bubble coupling defect, voltage ramping vasoconstriction, and absolute contraindications."}, {"id": "day10", "badge": "Day 10", "date": "2026-09-16", "category": "Energy & Laser Biophysics", "readTime": "5 min", "figures": 0, "url": "day10.html", "title": "Laser Lithotripsy Biophysics: Ho:YAG vs. TFL, Pulse Modulation & Thermal Kinetics", "summary": "Water absorption peaks, short vs. long pulse mechanics, Moses double-pulse vapor channel, 150 \u00b5m TFL fiber optics, and intermittent duty-cycle thermal protection."}, {"id": "day09", "badge": "Day 9", "date": "2026-09-15", "category": "Complex & Diversion Stones", "readTime": "5 min", "figures": 0, "url": "day09.html", "title": "Complex Stone Clearance: Staghorn Strategy, Multi-Tract PCNL & ECIRS", "summary": "Natural history of staghorns, upper vs. lower pole primary access, hemorrhage cost of extra tracts, Galdakao-modified supine ECIRS synergies, and second-look nephroscopy."}, {"id": "day08", "badge": "Day 8", "date": "2026-09-14", "category": "Metabolic Stone Disease", "readTime": "5 min", "figures": 0, "url": "day08.html", "title": "Metabolic Stone Evaluation: 24-Hour Urine Interpretation, Collection Errors & Pharmacotherapy", "summary": "24-hour urine timing, creatinine validation (over- vs. under-collection), quantitative cutoffs, the dietary calcium paradox, and thiazide/potassium citrate/allopurinol algorithms."}, {"id": "day07", "badge": "Day 7", "date": "2026-09-13", "category": "Complex & Diversion Stones", "readTime": "5 min", "figures": 0, "url": "day07.html", "title": "Calculus Management in Urinary Diversions: Access Topography, Lithotripsy & Stomal Preservation", "summary": "Hyperchloremic acidosis & mucus matrix, operative note reconnaissance, protecting continent catheterizable stomas, antegrade superiority for upper tracts, and percutaneous poucholithotomy."}, {"id": "day06", "badge": "Day 6", "date": "2026-09-12", "category": "Strictures & UPJO", "readTime": "5 min", "figures": 0, "url": "day06.html", "title": "Endopyelotomy & Endoureterotomy: Vascular Anatomy, Incision Mechanics & Regeneration", "summary": "Ideal candidate triad, crossing vessel prevalence (30%\u201340%), anatomical compass for safe endoscopic incisions, yellow-fat endpoint, Davis regeneration biology, and MAG3 washout."}, {"id": "day05", "badge": "Day 5", "date": "2026-09-11", "category": "RIRS & Ureteroscopy", "readTime": "5 min", "figures": 0, "url": "day05.html", "title": "Ureteral Access Sheaths (UAS): Fluid Kinetics, PULS Grading & Stricture Prevention", "summary": "Outflow resistance physics, Traxer/PULS Grades 0\u20134, microvascular radial compression, no-force insertion rules, and withdrawal ureteroscopy stenting protocols."}, {"id": "day04", "badge": "Day 4", "date": "2026-09-10", "category": "RIRS & Ureteroscopy", "readTime": "5 min", "figures": 0, "url": "day04.html", "title": "Retrograde Intrarenal Surgery (RIRS): Lower Pole Clearance, Laser Dynamics & Scope Longevity", "summary": "Lower pole geometry triad, calyceal relocation maneuver, fiber sizing vs. deflection loss, dusting vs. fragmenting vs. pop-dusting, and stent omission criteria."}, {"id": "day03", "badge": "Day 3", "date": "2026-09-09", "category": "PCNL Access & Dilation", "readTime": "5 min", "figures": 0, "url": "day03.html", "title": "Standard PCNL vs. Mini-PCNL: Fluid Dynamics, Sheath Kinetics & Selection", "summary": "Tract cross-sectional area scaling, outflow clearance gap & IRP hazards, suction sheaths, stone burden thresholds, and tubeless/totally tubeless exit criteria."}, {"id": "day02", "badge": "Day 2", "date": "2026-09-08", "category": "PCNL Access & Dilation", "readTime": "5 min", "figures": 0, "url": "day02.html", "title": "PCNL: Access Anatomy, Puncture Principles & Tract Dilation", "summary": "Avascular plane of Br\u00f6del, papillary vs. infundibular puncture, bull's-eye vs. triangulation, supracostal rib rules, balloon vs. Amplatz dilation, and bleeding tamponade."}, {"id": "day01", "badge": "Day 1", "date": "2026-09-03", "category": "Endourology Foundations", "readTime": "5 min", "figures": 0, "url": "day01.html", "title": "High-Yield Endourology Pearls: Safe Incisions, Laser Physics, IRP & Sepsis", "summary": "Infundibulotomy & endoureterotomy safe planes, Ho:YAG vs. TFL penetration, IRP/UAS control, post-URS sepsis predictors, and stent morbidity management."}];
      const params = new URLSearchParams(window.location.search);
      const requested = params.get('p');
      let activeId = (PEARLS.find(x => x.id === requested) || PEARLS[0]).id;
      let readSet = new Set();

      try {
        const saved = JSON.parse(localStorage.getItem('endourology_pearls_read') || '[]');
        if (Array.isArray(saved)) readSet = new Set(saved);
      } catch (e) {}

      function saveRead() {
        try {
          localStorage.setItem('endourology_pearls_read', JSON.stringify(Array.from(readSet)));
        } catch (e) {}
      }

      const sidebar = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const searchInput = document.getElementById('search-input');
      const pearlList = document.getElementById('pearl-list');
      const viewer = document.getElementById('pearl-viewer');
      const activeSubtitle = document.getElementById('active-subtitle');
      const progressPill = document.getElementById('progress-pill');
      const markReadBtn = document.getElementById('mark-read-btn');
      const shareBtn = document.getElementById('share-btn');
      const countLabel = document.getElementById('count-label');
      const toast = document.getElementById('toast');

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 2400);
      }

      let sidebarOpen = window.innerWidth >= 1024;
      function syncSidebar() {
        sidebar.classList.toggle('-translate-x-full', !sidebarOpen);
        sidebar.classList.toggle('hidden', !sidebarOpen && window.innerWidth >= 1024);
      }
      sidebarToggle.addEventListener('click', () => {
        sidebarOpen = !sidebarOpen;
        syncSidebar();
      });
      syncSidebar();

      function updateHeader() {
        const current = PEARLS.find(p => p.id === activeId) || PEARLS[0];
        activeSubtitle.textContent = `${current.badge} · ${current.title}`;
        progressPill.textContent = `${readSet.size} / ${PEARLS.length} Read`;
        const isRead = readSet.has(current.id);
        markReadBtn.textContent = isRead ? '✓ Marked Read' : 'Mark as Read';
        markReadBtn.className = isRead
          ? 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white transition'
          : 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white transition';
      }

      function renderList() {
        const q = (searchInput.value || '').trim().toLowerCase();
        const filtered = PEARLS.filter(p =>
          !q ||
          p.title.toLowerCase().includes(q) ||
          p.category.toLowerCase().includes(q) ||
          p.badge.toLowerCase().includes(q) ||
          p.summary.toLowerCase().includes(q)
        );
        countLabel.textContent = `${filtered.length} of ${PEARLS.length} briefs`;

        if (!filtered.length) {
          pearlList.innerHTML = '<div class="p-4 text-xs text-slate-500 text-center">No matching pearls found.</div>';
          return;
        }

        pearlList.innerHTML = filtered.map(p => {
          const isActive = p.id === activeId;
          const isRead = readSet.has(p.id);
          return `
            <button type="button" data-id="${p.id}" class="pearl-item w-full text-left p-3 rounded-xl border transition ${isActive ? 'bg-blue-50 border-blue-400 shadow-sm' : 'bg-white border-slate-200 hover:bg-slate-50'}">
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-bold ${isActive ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'}">${p.badge}</span>
                <span class="text-[11px] font-semibold ${isRead ? 'text-emerald-600' : 'text-slate-400'}">${isRead ? '✓ Read' : p.readTime}</span>
              </div>
              <div class="text-xs sm:text-sm font-bold text-slate-900 leading-snug">${p.title}</div>
              <div class="text-[11px] text-slate-500 mt-1 line-clamp-2">${p.summary}</div>
              <div class="flex items-center gap-2 mt-2 text-[10px] text-slate-500 font-medium">
                <span>${p.category}</span>
                ${p.figures > 0 ? `<span>· ${p.figures} figures</span>` : ''}
              </div>
            </button>
          `;
        }).join('');

        pearlList.querySelectorAll('.pearl-item').forEach(btn => {
          btn.addEventListener('click', () => {
            selectPearl(btn.getAttribute('data-id'));
            if (window.innerWidth < 1024) {
              sidebarOpen = false;
              syncSidebar();
            }
          });
        });
      }

      function selectPearl(id) {
        const p = PEARLS.find(x => x.id === id);
        if (!p) return;
        activeId = id;
        viewer.src = p.url;
        try {
          const nextUrl = new URL(window.location.href);
          nextUrl.searchParams.set('p', id);
          window.history.replaceState({}, '', nextUrl.toString());
        } catch (e) {}
        updateHeader();
        renderList();
      }

      markReadBtn.addEventListener('click', () => {
        if (readSet.has(activeId)) readSet.delete(activeId);
        else readSet.add(activeId);
        saveRead();
        updateHeader();
        renderList();
      });

      shareBtn.addEventListener('click', () => {
        const shareUrl = window.location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl).then(() => showToast('Direct link copied!')).catch(() => showToast('Copy URL from address bar'));
        } else {
          showToast('Copy URL from address bar');
        }
      });

      searchInput.addEventListener('input', renderList);
      selectPearl(activeId);
    })();
  </script>
</body>
</html>
